name: Infrastructure Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Select the infrastructure operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy

env:
  AWS_REGION: ap-south-1

jobs:
  infrastructure_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

  infrastructure_deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'
    needs: infrastructure_test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRETKEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Deploy infrastructure stacks
        run: uv run main

  infrastructure_destroy:
    if: always() && (github.event_name == 'push' || inputs.operation == 'destroy')
    needs: [infrastructure_test, infrastructure_deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRETKEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Destroy infrastructure
        run: uv run destroy