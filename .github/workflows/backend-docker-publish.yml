name: Backend ECR Build

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

env:
  AWS_REGION: ap-south-1
  AUTH_REPOSITORY: pdw-ecr-sandbox-auth-microservicesinfra
  PRODUCT_REPOSITORY: pdw-ecr-sandbox-product-microservicesinfra



jobs:
  backend_docker_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRETKEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repositories if missing
        run: |
          aws ecr describe-repositories \
            --repository-names $AUTH_REPOSITORY \
            >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name $AUTH_REPOSITORY

          aws ecr describe-repositories \
            --repository-names $PRODUCT_REPOSITORY \
            >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name $PRODUCT_REPOSITORY

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build and Push Auth Service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$AUTH_REPOSITORY:$IMAGE_TAG \
            -f backend/auth/Dockerfile \
            backend/auth

          docker push \
            $ECR_REGISTRY/$AUTH_REPOSITORY:$IMAGE_TAG

      - name: Build and Push Product Service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$PRODUCT_REPOSITORY:$IMAGE_TAG \
            -f backend/product/Dockerfile \
            backend/product

          docker push \
            $ECR_REGISTRY/$PRODUCT_REPOSITORY:$IMAGE_TAG
