[project]
name = "microservices-project-infra"
version = "0.1.0"
description = "Micor services project infrastructure"
readme = "README.md"
authors = [
    { name = "Puneet Dwivedi", email = "pdwivedi294@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.78",
    "python-dotenv>=1.2.3",
]

[project.scripts]
main = "src.main:main"
build = "src.main:build"
deploy = "src.main:deploy"
destroy = "scripts.destroy:main"
microservices-project-infra = "src.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "src"
module-root = "."

[dependency-groups]
dev = [
    "moto[cloudformation,s3]>=5.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["htmlcov"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
