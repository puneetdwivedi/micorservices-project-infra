[project]
name = "microservices-project-infra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Puneet Dwivedi", email = "pdwivedi294@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.78",
    "python-dotenv>=1.2.3",
]

[project.scripts]
main = "src.main:main"
build = "src.main:main"
deploy = "scripts.deploy:main"
microservices-project-infra = "src.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "src"
module-root = "."
